name: Test

on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.x

      - name: Install
        run: npm ci

      - name: Compile to Wasm and test
        run: |
          rm lib/lexer.wasm
          npm run build-wasm
          npm run build
          npm test

      - name: Benchmark Wasm
        run: npm run bench
